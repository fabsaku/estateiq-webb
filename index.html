:root { --botten: #0A1410; --salvia: #7F9C8C; --salvia-ljus: #A9BDB1; --text: #F2F5F0; --lime: #C8F14F; --linje: 2.5px; --mono: "IBM Plex Mono", ui-monospace, monospace; }
* { box-sizing: border-box; margin: 0; border-radius: 0; }
html, body { height: 100%; }
body { background: var(--botten); color: var(--text); font-family: "Space Grotesk", system-ui, sans-serif; font-weight: 500; overflow-x: hidden; }

/* Flygningen ligger under allt. Bladets ram ligger över. */
#stad { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.ram { position: fixed; inset: 16px; border: var(--linje) solid var(--salvia); pointer-events: none; }

/* Tunnelbanans och pendeltågens stationer. Placeras av skriptet och blinkar när ett tåg går. */
.noder { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.nod { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
.nod i { position: relative; display: block; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; background: var(--lime); }
.nod i::after { content: ""; position: absolute; inset: -3px; border: 1.5px solid var(--lime); opacity: 0; }
.nod.gar i::after { animation: puls 2.8s ease-out 1; }
@keyframes puls { 0% { transform: scale(1); opacity: .95; } 70%, 100% { transform: scale(4.4); opacity: 0; } }

.topp {

<script>
// Utan mottagartjänst skickar sidan ingenting själv. Den öppnar besökarens mejlprogram med ett färdigt mejl.
document.getElementById('anmalan').addEventListener('submit', function (h) {
  if (this.getAttribute('action')) return;
  h.preventDefault();
  var falt = this.querySelector('input[type=email]'), svar = this.querySelector('.svar');
  if (!falt.value || !falt.checkValidity()) { svar.textContent = 'Skriv en giltig e-postadress.'; falt.focus(); return; }
  var amne = 'Meddela mig när EstateIQ finns', text = 'Hej! Meddela mig när EstateIQ finns för iPhone.\n\nMin adress: ' + falt.value;
  window.location.href = 'mailto:contactestateiq@gmail.com?subject=' + encodeURIComponent(amne) + '&body=' + encodeURIComponent(text);
  svar.textContent = 'Ett färdigt mejl öppnas i ditt mejlprogram. Händer inget? Skriv till contactestateiq@gmail.com.';
});

// Flygningen: centrala Stockholm som trådmodell, ritad med WebGL utan bibliotek.
(function () {
  'use strict';
  var data = window.STHLM, duk = document.getElementById('stad');
  var gl = duk.getContext('webgl', { antialias: true, alpha: false, powerPreference: 'low-power' });
  if (!data || !gl) return; // Utan WebGL står bladet kvar med ram, logga och formulär.

  var LAT0 = 59.3275, LON0 = 18.0690, KY = 110540, KX = Math.cos(LAT0 * Math.PI / 180) * 111320;
  var BOTTEN = [10 / 255, 20 / 255, 16 / 255];
  var lugnt = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- Geometri ----
  function trianglar(r) { // öronklippning av en moturs ring
    var n = r.length, idx = [], ut = [], i, varv = 0;
    for (i = 0; i < n; i++) idx.push(i);
    while (idx.length > 3 && varv++ < n * n) {
      var klippt = false;
      for (i = 0; i < idx.length; i++) {
        var m = idx.length, a = r[idx[(i + m - 1) % m]], b = r[idx[i]], c = r[idx[(i + 1) % m]];
        if ((b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]) <= 0) continue;
        var fri = true;
        for (var k = 0; k < m && fri; k++) {
          var p = r[idx[k]];
          if (p === a || p === b || p === c) continue;
          var d1 = (b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0]);
          var d2 = (c[0] - b[0]) * (p[1] - b[1]) - (c[1] - b[1]) * (p[0] - b[0]);
          var d3 = (a[0] - c[0]) * (p[1] - c[1]) - (a[1] - c[1]) * (p[0] - c[0]);
          if (d1 >= 0 && d2 >= 0 && d3 >= 0) fri = false;
        }
        if (!fri) continue;
        ut.push(idx[(i + m - 1) % m], idx[i], idx[(i + 1) % m]);
        idx.splice(i, 1); klippt = true; break;
      }
      if (!klippt) break;
    }
    for (i = 1; i < idx.length - 1; i++) ut.push(idx[0], idx[i], idx[i + 1]);
    return ut;
  }

  var ytor = [], kanter = [];
  data.b.forEach(function (b) {
    var h = b[0], r = [], i, n;
    for (i = 1; i < b.length; i += 2) r.push([b[i] / 2, b[i + 1] / 2]);
    n = r.length;
    for (i = 0; i < n; i++) {
      var p = r[i], q = r[(i + 1) % n], o = r[(i + n - 1) % n];
      ytor.push(p[0], p[1], 0, q[0], q[1], 0, q[0], q[1], h, p[0], p[1], 0, q[0], q[1], h, p[0], p[1], h);
      kanter.push(p[0], p[1], h, q[0], q[1], h);
      // Lodräta kanter bara i riktiga hörn, annars blir fasaderna randiga.
      var ux = p[0] - o[0], uy = p[1] - o[1], vx = q[0] - p[0], vy = q[1] - p[1];
      var sv = Math.abs(ux * vy - uy * vx) / ((Math.hypot(ux, uy) * Math.hypot(vx, vy)) || 1);
      if (sv > 0.38) kanter.push(p[0], p[1], 0, p[0], p[1], h);
    }
    var t = trianglar(r);
    for (i = 0; i < t.length; i++) ytor.push(r[t[i]][0], r[t[i]][1], h);
  });

  // Broar: ett däck på pelare. Däcket täcker vattnet under sig och kanterna ritas som husens.
  function rad(a, fran) { var r = []; for (var i = fran; i < a.length; i += 2) r.push([a[i] / 2, a[i + 1] / 2]); return r; }
  function langs(p, steg, gor) { // anropar gor(x, y, nx, ny) var steg:e meter längs linjen, med normalen
    var kvar = steg / 2;
    for (var i = 0; i + 1 < p.length; i++) {
      var dx = p[i + 1][0] - p[i][0], dy = p[i + 1][1] - p[i][1], l = Math.hypot(dx, dy);
      if (!l) continue;
      for (; kvar <= l; kvar += steg) gor(p[i][0] + dx * kvar / l, p[i][1] + dy * kvar / l, -dy / l, dx / l);
      kvar -= l;
    }
  }
  (data.br || []).forEach(function (b) {
    var halv = b[0] / 2, z = b[1], p = rad(b, 2), va = [], ho = [], i, n = p.length;
    for (i = 0; i < n; i++) {
      var a = p[Math.max(i - 1, 0)], c = p[Math.min(i + 1, n - 1)], dx = c[0] - a[0], dy = c[1] - a[1], l = Math.hypot(dx, dy) || 1;
      va.push([p[i][0] - dy / l * halv, p[i][1] + dx / l * halv]); ho.push([p[i][0] + dy / l * halv, p[i][1] - dx / l * halv]);
    }
    for (i = 0; i + 1 < n; i++) {
      ytor.push(va[i][0], va[i][1], z, ho[i][0], ho[i][1], z, ho[i + 1][0], ho[i + 1][1], z,
        va[i][0], va[i][1], z, ho[i + 1][0], ho[i + 1][1], z, va[i + 1][0], va[i + 1][1], z);
      kanter.push(va[i][0], va[i][1], z, va[i + 1][0], va[i + 1][1], z, ho[i][0], ho[i][1], z, ho[i + 1][0], ho[i + 1][1], z);
    }
    langs(p, 45, function (x, y, nx, ny) {
      kanter.push(x + nx * halv, y + ny * halv, 0, x + nx * halv, y + ny * halv, z, x - nx * halv, y - ny * halv, 0, x - nx * halv, y - ny * halv, z);
    });
  });

  // Spår ovan jord: en linje med syllar, som järnväg ritas på en karta.
  var spar = [];
  (data.sp || []).forEach(function (b) {
    var z = b[0] + 0.5, p = rad(b, 1);
    for (var i = 0; i + 1 < p.length; i++) spar.push(p[i][0], p[i][1], z, p[i + 1][0], p[i + 1][1], z);
    langs(p, 9, function (x, y, nx, ny) { spar.push(x + nx * 1.8, y + ny * 1.8, z, x - nx * 1.8, y - ny * 1.8, z); });
  });

  // Tunnlar: streckade linjer som syns genom marken. Tunnelbanan ljusare än järnvägstunnlarna.
  var tbana = [], tunnel = [];
  (data.tu || []).forEach(function (b) {
    var mal = b[0] ? tbana : tunnel, p = rad(b, 1), kvar = 0, pa = true;
    for (var i = 0; i + 1 < p.length; i++) {
      var dx = p[i + 1][0] - p[i][0], dy = p[i + 1][1] - p[i][1], l = Math.hypot(dx, dy), t = 0;
      if (!l) continue;
      while (t < l) {
        var bit = Math.min((pa ? 11 : 7) - kvar, l - t);
        if (pa) mal.push(p[i][0] + dx * t / l, p[i][1] + dy * t / l, 0.6, p[i][0] + dx * (t + bit) / l, p[i][1] + dy * (t + bit) / l, 0.6);
        t += bit; kvar += bit;
        if (kvar >= (pa ? 11 : 7) - 1e-6) { kvar = 0; pa = !pa; }
      }
    }
  });

  var rutnat = [], R = 4500, STEG = 90, v;
  for (v = -R; v <= R; v += STEG) rutnat.push(v, -R, 0, v, R, 0, -R, v, 0, R, v, 0);

  var strand = [];
  data.s.forEach(function (s) {
    for (var i = 0; i + 3 < s.length; i += 2) strand.push(s[i] / 2, s[i + 1] / 2, 0.5, s[i + 2] / 2, s[i + 3] / 2, 0.5);
  });

  // Vattnet: en mörkare yta och täta vågräta linjer, som vatten ritas på ett kartblad.
  var vatten = [], vagor = [], VAG = 14;
  for (v = 0; v + 3 < (data.v || []).length; v += 4) {
    var x1 = data.v[v] / 2, y1 = data.v[v + 1] / 2, x2 = data.v[v + 2] / 2, y2 = data.v[v + 3] / 2;
    vatten.push(x1, y1, 0, x2, y1, 0, x2, y2, 0, x1, y1, 0, x2, y2, 0, x1, y2, 0);
    for (var vy = Math.ceil(y1 / VAG) * VAG; vy < y2; vy += VAG) vagor.push(x1, vy, 0.2, x2, vy, 0.2);
  }

  // Stationerna är sidans mätpunkter: en lime punkt på ett lod över varje station.
  var punkter = [];
  for (v = 0; v + 3 < (data.st || []).length; v += 4)
    punkter.push({ x: data.st[v] / 2, y: data.st[v + 1] / 2, z: 42, plats: data.st[v + 2], slag: data.st[v + 3] ? 'TRAIN' : 'METRO' });
  var lod = [];
  punkter.forEach(function (p) { lod.push(p.x, p.y, 0, p.x, p.y, p.z); });

  var hallare = document.querySelector('.noder');
  punkter.forEach(function (p) {
    p.el = document.createElement('div'); p.el.className = 'nod';
    p.el.innerHTML = '<i></i>';
    hallare.appendChild(p.el);
  });

  // ---- WebGL ----
  // Geometrin sparas som taltabeller, så att allt kan byggas om ifall webbläsaren tar tillbaka grafikminnet.
  ytor = new Float32Array(ytor); kanter = new Float32Array(kanter); rutnat = new Float32Array(rutnat);
  strand = new Float32Array(strand); lod = new Float32Array(lod);
  vatten = new Float32Array(vatten); vagor = new Float32Array(vagor);
  spar = new Float32Array(spar); tbana = new Float32Array(tbana); tunnel = new Float32Array(tunnel);
  var uVp, uFarg, uDis, aP, bYtor, bKanter, bRutnat, bStrand, bLod, bVatten, bVagor, bSpar, bTbana, bTunnel;

  function skuggare(typ, kod) {
    var s = gl.createShader(typ); gl.shaderSource(s, kod); gl.compileShader(s);
    return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null;
  }
  function buffert(tal) { var b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, tal, gl.STATIC_DRAW); return { b: b, n: tal.length / 3 }; }
  function bygg() { // falskt om grafikkortet inte tar emot programmet
    var hörn = skuggare(gl.VERTEX_SHADER,
      'attribute vec3 p; uniform mat4 vp; varying float d; void main(){ gl_Position = vp * vec4(p, 1.0); d = gl_Position.w; }');
    var yta = skuggare(gl.FRAGMENT_SHADER,
      'precision mediump float; uniform vec3 farg; uniform vec3 botten; uniform vec2 dis; varying float d;' +
      'void main(){ float f = smoothstep(dis.x, dis.y, d); gl_FragColor = vec4(mix(farg, botten, f), 1.0); }');
    if (!hörn || !yta) return false;
    var prog = gl.createProgram();
    gl.attachShader(prog, hörn); gl.attachShader(prog, yta); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return false;
    gl.useProgram(prog);
    uVp = gl.getUniformLocation(prog, 'vp'); uFarg = gl.getUniformLocation(prog, 'farg'); uDis = gl.getUniformLocation(prog, 'dis');

    bYtor = buffert(ytor); bKanter = buffert(kanter); bRutnat = buffert(rutnat); bStrand = buffert(strand); bLod = buffert(lod);
    bVatten = buffert(vatten); bVagor = buffert(vagor);
    bSpar = buffert(spar); bTbana = buffert(tbana); bTunnel = buffert(tunnel);
    return true;
  }
  if (!bygg()) { duk.style.display = 'none'; hallare.style.display = 'none'; return; }

  function rita(b, sort, farg) {
    gl.bindBuffer(gl.ARRAY_BUFFER, b.b); gl.vertexAttribPointer(aP, 3, gl.FLOAT, false, 0, 0);
    gl.uniform3fv(uFarg, farg); gl.drawArrays(sort, 0, b.n);
  }

  // ---- Kamera ----
  function perspektiv(fov, bild, nara, fjarran) {
    var f = 1 / Math.tan(fov / 2), nf = 1 / (nara - fjarran);
    return [f / bild, 0, 0, 0, 0, f, 0, 0, 0, 0, (fjarran + nara) * nf, -1, 0, 0, 2 * fjarran * nara * nf, 0];
  }
  function sikt(e, m) { // z uppåt
    var fx = m[0] - e[0], fy = m[1] - e[1], fz = m[2] - e[2], l = Math.hypot(fx, fy, fz); fx /= l; fy /= l; fz /= l;
    var sx = fy, sy = -fx, sz = 0, sl = Math.hypot(sx, sy); sx /= sl; sy /= sl;
    var ux = sy * fz - sz * fy, uy = sz * fx - sx * fz, uz = sx * fy - sy * fx;
    return [sx, ux, -fx, 0, sy, uy, -fy, 0, sz, uz, -fz, 0,
      -(sx * e[0] + sy * e[1] + sz * e[2]), -(ux * e[0] + uy * e[1] + uz * e[2]), fx * e[0] + fy * e[1] + fz * e[2], 1];
  }
  function gang(a, b) {
    var ut = new Float32Array(16);
    for (var k = 0; k < 4; k++) for (var r = 0; r < 4; r++)
      ut[k * 4 + r] = a[r] * b[k * 4] + a[4 + r] * b[k * 4 + 1] + a[8 + r] * b[k * 4 + 2] + a[12 + r] * b[k * 4 + 3];
    return ut;
  }

  var B = 0, H = 0, tathet = 1;
  function storlek() {
    tathet = Math.min(window.devicePixelRatio || 1, 2);
    B = duk.clientWidth; H = duk.clientHeight;
    duk.width = Math.round(B * tathet); duk.height = Math.round(H * tathet);
    gl.viewport(0, 0, duk.width, duk.height);
    matGolv();
  }

  // Mätpunkter visas bara under rutan. Gränsen mäts om när rutan flyttar sig eller ändrar höjd.
  var formular = document.getElementById('anmalan'), golv = 0;
  function matGolv() { golv = formular.getBoundingClientRect().bottom + 24; if (lugnt && igang) bild(0); }
  window.addEventListener('scroll', matGolv, { passive: true });
  if (window.ResizeObserver) new ResizeObserver(matGolv).observe(formular);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(matGolv);
  function bild(ms) {
    var t = ms / 1000;
    // Kameran glider i en långsam slinga och vrider sig ett varv på drygt tre minuter.
    var kurs = 1.15 + t * 0.031;
    var mx = 80 + 520 * Math.sin(t * 0.019 + 0.4), my = 60 + 360 * Math.sin(t * 0.027 + 1.9);
    var hojd = 400 + 40 * Math.sin(t * 0.05), avst = 1050;
    var oga = [mx - Math.cos(kurs) * avst, my - Math.sin(kurs) * avst, hojd];
    var stående = H > B;
    var vp = gang(perspektiv((stående ? 52 : 38) * Math.PI / 180, B / H, 8, 12000), sikt(oga, [mx, my, 10]));
    // Sikta lägre i bilden: toppen blir fjärran och lugn, där loggan och rutan står.
    var ned = stående ? -0.52 : -0.74;
    for (var k = 0; k < 4; k++) vp[k * 4 + 1] += ned * vp[k * 4 + 3];

    gl.clearColor(BOTTEN[0], BOTTEN[1], BOTTEN[2], 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.uniformMatrix4fv(uVp, false, vp);
    gl.uniform2f(uDis, 600, 2900);
    gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);

    gl.depthMask(true); gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(1.5, 2);
    rita(bYtor, gl.TRIANGLES, [0.052, 0.098, 0.079]);
    gl.disable(gl.POLYGON_OFFSET_FILL); gl.depthMask(false);
    rita(bRutnat, gl.LINES, [0.2, 0.3, 0.255]);
    rita(bVatten, gl.TRIANGLES, [0.016, 0.04, 0.036]); // täcker rutnätet: nätet ligger bara på land
    rita(bVagor, gl.LINES, [0.13, 0.215, 0.195]);
    rita(bStrand, gl.LINES, [0.6, 0.74, 0.66]);
    rita(bKanter, gl.LINES, [0.56, 0.69, 0.62]);
    rita(bSpar, gl.LINES, [0.7, 0.81, 0.75]);
    gl.disable(gl.DEPTH_TEST); // det som ligger under jord syns genom hus och mark
    rita(bTunnel, gl.LINES, [0.27, 0.37, 0.33]);
    rita(bTbana, gl.LINES, [0.62, 0.73, 0.67]);
    gl.enable(gl.DEPTH_TEST);
    rita(bLod, gl.LINES, [0.784, 0.945, 0.31]);

    punkter.forEach(function (p) {
      var x = vp[0] * p.x + vp[4] * p.y + vp[8] * p.z + vp[12], y = vp[1] * p.x + vp[5] * p.y + vp[9] * p.z + vp[13];
      var w = vp[3] * p.x + vp[7] * p.y + vp[11] * p.z + vp[15];
      var sx = (x / w * 0.5 + 0.5) * B, sy = (0.5 - y / w * 0.5) * H;
      var syns = w > 60 && sx > 30 && sx < B - 30 && sy > golv && sy < H - 70;
      var dis = Math.min(1, Math.max(0, (w - 700) / 2600));
      p.el.style.opacity = syns ? (1 - dis * dis).toFixed(2) : 0;
      if (syns) p.el.style.transform = 'translate(' + sx.toFixed(1) + 'px,' + sy.toFixed(1) + 'px)';
    });
  }

  // Avgångar: en station blinkar när ett tåg går därifrån. Tiderna kommer från SL via Trafiklab.se.
  // En fråga var fjärde sekund, en station i taget, bara medan sidan syns och högst en kvart.
  function avgangar() {
    var tur = 0, blinkat = {}, slut = Date.now() + 15 * 60000;
    // SL svarar i svensk tid utan zon: räkna ut hur långt besökarens klocka ligger från Stockholms.
    var nu = new Date(), skift = new Date(nu.toLocaleString('sv-SE', { timeZone: 'Europe/Stockholm' }).replace(' ', 'T')) - nu;
    if (isNaN(skift)) skift = 0;
    function blinka(p) { p.el.classList.remove('gar'); void p.el.offsetWidth; p.el.classList.add('gar'); }
    function fraga() {
      if (Date.now() > slut || !punkter.length) return;
      setTimeout(fraga, 4000);
      if (document.hidden) return;
      var p = punkter[tur++ % punkter.length];
      fetch('https://transport.integration.sl.se/v1/sites/' + p.plats + '/departures?transport=' + p.slag + '&forecast=5')
        .then(function (s) { return s.ok ? s.json() : null; })
        .then(function (svar) {
          ((svar && svar.departures) || []).forEach(function (a) {
            var resa = a.journey || {}, nyckel = p.plats + ':' + resa.id, om = new Date(a.expected) - skift - Date.now();
            if (resa.state === 'CANCELLED' || blinkat[nyckel] || isNaN(om) || om < -20000 || om > 120000) return;
            blinkat[nyckel] = 1;
            setTimeout(function () { blinka(p); }, Math.max(0, om));
          });
        })
        .catch(function () {}); // utan svar står punkterna stilla
    }
    fraga();
  }
  if (!lugnt && window.fetch) avgangar();

  // Flygningen är långsam: trettio bilder i sekunden räcker och sparar batteri.
  var start = null, senast = -1e9, igang = true, STEGTID = 1000 / 30 - 2;
  function slinga(ms) {
    if (!igang) return;
    requestAnimationFrame(slinga);
    if (ms - senast < STEGTID) return;
    senast = ms;
    if (start === null) start = ms;
    bild(ms - start);
  }
  duk.addEventListener('webglcontextlost', function (h) { h.preventDefault(); igang = false; hallare.style.visibility = 'hidden'; });
  duk.addEventListener('webglcontextrestored', function () {
    if (!bygg()) return;
    igang = true; hallare.style.visibility = ''; storlek();
    if (lugnt) bild(0); else requestAnimationFrame(slinga);
  });
  storlek();
  window.addEventListener('resize', function () { storlek(); if (lugnt && igang) bild(0); });
  if (lugnt) bild(0); else requestAnimationFrame(slinga);
})();
</script>
